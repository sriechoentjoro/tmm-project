# Only index.php may be run.
# =========================================================================
#
# This file is not included by anything on its own. It is the block to paste
# INSIDE the `location /tmm { ... }` of the live nginx site, ABOVE the
# `location ~ \.php$` that is already in there. nginx tries nested regex
# locations in the order they are written and the first that matches wins, so
# the order is the whole point.
#
# Why it is needed
# ----------------
# The site is served by nginx and PHP runs through php7.4-fpm. The `/tmm`
# block ends in
#
#     location ~ \.php$ {
#         fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
#         ...
#         fastcgi_param SCRIPT_FILENAME $request_filename;
#     }
#
# which hands ANY .php file under the web root to PHP, wherever it came from -
# including webroot/files/uploads/ and webroot/img/uploads/, where the
# application writes what people upload. The upload helpers now hold the
# extension to an allow list, which is the real defence; this is the second
# lock, so that a file that somehow gets in under such a name is refused
# rather than run.
#
# webroot/files/.htaccess and webroot/img/uploads/.htaccess do the same job,
# and nginx does not read .htaccess at all. They are kept for a deployment
# behind Apache; here they are inert, which is why this file exists.
#
# The whole web root holds exactly one PHP file - webroot/index.php, the
# CakePHP front controller - so the rule can be the strict one: run that, deny
# the rest. Nothing legitimate is lost, and it covers any directory, not only
# the two the uploads use today.

        # Only the front controller is executable. Everything else that ends
        # in a scripting extension is refused, wherever it sits.
        location ~ ^/tmm/(?!index\.php$).*\.(php|phtml|php[3457]|phps|phar|pht|cgi|pl|py|sh)$ {
            deny all;
        }

# If a later version of this application adds a second entry point under
# webroot, name it in the lookahead beside index.php rather than widening the
# rule:
#
#         location ~ ^/tmm/(?!(index|something)\.php$).*\.(php|...)$ {
#
# A narrower rule, if the strict one is not wanted: refuse scripts only where
# uploads land, and leave the rest of the web root as it is.
#
#         location ~ ^/tmm/(files|img)/.*\.(php|phtml|php[3457]|phps|phar|pht|cgi|pl|py|sh)$ {
#             deny all;
#         }
#
# After editing the site file:
#
#     nginx -t && systemctl reload nginx
#
# and check it took, from anywhere:
#
#     curl -s -o /dev/null -w '%{http_code}\n' https://tmm-demo.widagdo.web.id/tmm/files/uploads/nothing.php
#
# 403 is the rule working. 404 means the request reached the application
# instead, so the rule did not match - check it is above the .php block.
