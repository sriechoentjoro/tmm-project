# Only index.php may be run.
# =========================================================================
#
# This file is not included by anything on its own. It is the block to paste
# into the live nginx site file, INSIDE the server block that serves this
# application and ABOVE its `location ~ \.php$`. nginx picks a regex location
# by the order they are written and the first that matches wins, so the order
# is the whole point.
#
# On the machine this runs on today that file is
#
#     /etc/nginx/sites-available/tmm.asahifamily.co.conf
#
# It is short. The site is `server_name tmm.asahifamily.co.id` with
# `root /var/www/html/tmm/webroot`, so it is a server block with a root, not a
# sub-path with an alias: the URIs the rule sees are relative to webroot and
# carry no /tmm in front of them. An older config in this directory,
# main_server.conf, describes a /tmm sub-path arrangement that is not what is
# serving now; the variant for that shape is at the bottom.
#
# The block goes between
#
#     12      }                             <- end of `location /`
#     13                                    <- HERE
#     14      location ~ \.php$ {
#
# PHP there runs on its own pool, unix:/run/php/php7.4-fpm-tmm.sock, and
# includes snippets/fastcgi-php.conf, which carries `try_files $uri =404` and
# so already refuses the path-info trick (/photo.jpg/x.php). It does not
# refuse a real .php file sitting in an upload directory, which is what this
# is for.
#
# Why it is needed
# ----------------
# PHP runs through php7.4-fpm, and the site block ends in the usual
#
#     location ~ \.php$ {
#         fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
#         ...
#     }
#
# which hands ANY .php file under the web root to PHP, wherever it came from -
# including webroot/files/uploads/ and webroot/img/uploads/, where the
# application writes what people upload. A regex location is chosen ahead of
# the prefix location that holds try_files, so an uploaded file that exists is
# not rewritten to the front controller: it is executed.
#
# The upload helpers now hold the extension to an allow list, which is the
# real defence. This is the second lock, so that a file which somehow gets in
# under such a name is refused rather than run.
#
# webroot/files/.htaccess and webroot/img/uploads/.htaccess do the same job
# for Apache. nginx has no .htaccess mechanism and never reads them, which is
# why this file exists.
#
# The whole web root holds exactly one PHP file - webroot/index.php, the
# CakePHP front controller - so the rule can be the strict one: run that, deny
# the rest. Nothing legitimate is lost, and it covers any directory a later
# feature writes to, not only the two the uploads use today. CakePHP's own
# URLs carry no .php at all, so none of them match.

    # Only the front controller is executable. Everything else that ends in a
    # scripting extension is refused, wherever it sits.
    location ~ ^/(?!index\.php$).*\.(php|phtml|php[3457]|phps|phar|pht|cgi|pl|py|sh)$ {
        deny all;
    }

    # And nothing beginning with a dot is served at all. webroot/files/ and
    # webroot/img/uploads/ each carry an .htaccess for an Apache deployment,
    # and this block has no dotfile rule of its own, so they would be handed
    # over as plain text to anybody who asked. They say nothing worth having,
    # but a file the server was not asked to publish should not be published.
    location ~ /\. {
        deny all;
    }

# If a later version of this application adds a second entry point under
# webroot, name it in the lookahead beside index.php rather than widening the
# rule:
#
#     location ~ ^/(?!(index|something)\.php$).*\.(php|...)$ {
#
# Where the application is served as a sub-path instead, with
# `location /tmm { alias ...; }`, the rule goes inside that location and the
# prefix goes into the pattern:
#
#     location ~ ^/tmm/(?!index\.php$).*\.(php|phtml|php[3457]|phps|phar|pht|cgi|pl|py|sh)$ {
#         deny all;
#     }
#
# After editing the site file:
#
#     nginx -t && systemctl reload nginx
#
# and check it took, against the host the site really answers on:
#
#     curl -s -o /dev/null -w '%{http_code}\n' https://tmm.asahifamily.co.id/files/uploads/nothing.php
#     curl -s -o /dev/null -w '%{http_code}\n' https://tmm.asahifamily.co.id/files/.htaccess
#     curl -s -o /dev/null -w '%{http_code}\n' https://tmm.asahifamily.co.id/
#
# 403, 403, and 200 or 302. A 404 on the first means the request reached the
# application instead, so the rule did not match - check it is above the .php
# block and that the prefix in the pattern matches how the site is mounted.
#
# The host is tmm.asahifamily.co.id. Nothing in this nginx answers to
# tmm-demo.widagdo.web.id, so that name is served somewhere else or not at
# all, and testing against it proves nothing about this rule.
